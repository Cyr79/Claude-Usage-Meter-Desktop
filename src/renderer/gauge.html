<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Claude Usage Meter</title>
<style>
  :root { --bg: rgba(22,22,28,.96); --fg: #f2f2f4; --mut: #9a9aa6; --track: rgba(255,255,255,.09);
          --red: #ff453a; --green: #32d74b; --line: rgba(255,255,255,.08); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { font: 12px/1.35 "Segoe UI", system-ui, sans-serif; color: var(--fg); user-select: none; }
  .card { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 10px; }
  header { -webkit-app-region: drag; cursor: move; }
  header button { -webkit-app-region: no-drag; }
  header button.on { color: #ff9f0a; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  header b { font-size: 13px; }
  header button { background: none; border: 0; color: var(--mut); cursor: pointer; font-size: 13px; padding: 2px 4px; }
  header button:hover { color: var(--fg); }
  .m { padding: 8px 0; border-top: 1px solid var(--line); }
  .m:first-of-type { border-top: 0; }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .row .name { font-weight: 600; }
  .row .pct { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
  .track { position: relative; height: 14px; border-radius: 7px; background: var(--track); overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; border-radius: 7px; transition: width .6s ease, background .4s ease; }
  .fill::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 18px;
                 background: rgba(255,255,255,.45); filter: blur(4px); animation: pulse 1.6s infinite ease-in-out; }
  .fill.full { animation: alarm .9s infinite ease-in-out; }
  .tick { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #fff; opacity: .85; border-radius: 1px; }
  @keyframes pulse { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
  @keyframes alarm { 0%,100% { filter: brightness(1) } 50% { filter: brightness(1.45) } }
  .sub { color: var(--mut); margin-top: 5px; }
  .pace { margin-top: 3px; font-variant-numeric: tabular-nums; }
  .hot { color: var(--red); }
  .ok { color: var(--green); }
  .badge { display: inline-block; font-size: 10.5px; padding: 1px 6px; border-radius: 5px; margin-left: 6px; font-weight: 600; }
  .badge.hot { background: rgba(255,69,58,.18); border: 1px solid rgba(255,69,58,.35); }
  .badge.ok { background: rgba(50,215,75,.14); border: 1px solid rgba(50,215,75,.3); }
  footer { display: flex; justify-content: space-between; color: var(--mut); font-size: 10.5px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
  .empty { color: var(--mut); padding: 10px 0; }
</style>
</head>
<body>
<div class="card">
  <header><b>⚡ Claude energy</b><span><button id="c" title="Open Claude Desktop">✳</button><button id="p" title="Keep on screen (always on top)">📌</button><button id="r" title="Refresh">⟳</button><button id="x" title="Close">✕</button></span></header>
  <div id="list"><div class="empty">Waiting for first reading…</div></div>
  <footer><span id="upd"></span><span>white tick = where you should be</span></footer>
</div>
<script>
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const f1 = (n) => (Math.round(n * 10) / 10).toFixed(1);
  // Green -> amber -> red as it fills; forced red when over pace.
  function colour(pct, hot) {
    if (hot || pct >= 90) return 'linear-gradient(90deg,#ff9f0a,#ff453a)';
    const hue = Math.round(140 - Math.min(1, pct / 90) * 110);
    return `linear-gradient(90deg,hsl(${Math.min(190, hue + 40)} 85% 50%),hsl(${hue} 85% 50%))`;
  }
  function bar(pct, hot, tick) {
    const t = tick == null ? '' : `<div class="tick" style="left:calc(${Math.min(99.4, tick)}% - 1px)"></div>`;
    return `<div class="track"><div class="fill${pct >= 95 ? ' full' : ''}" style="width:${pct}%;background:${colour(pct, hot)}"></div>${t}</div>`;
  }
  function kTok(n) { return n >= 1e6 ? f1(n / 1e6) + 'M' : Math.round(n / 1000) + 'k'; }

  function meterBlock(m) {
    const p = m.pace;
    const u = p ? p.unit : '';
    let html = `<div class="m"><div class="row"><span class="name">${esc(m.label)}`;
    if (p) html += `<span class="badge ${p.hot ? 'hot' : 'ok'}">${p.overPace ? 'Over pace' : p.todayOver ? 'Too much today' : 'On pace'}</span>`;
    html += `</span><span class="pct ${p && p.hot ? 'hot' : ''}">${Math.round(m.pct)}%</span></div>`;
    html += bar(m.pct, p && p.hot, p ? p.expected : null);
    html += `<div class="sub">Resets ${esc(m.resetText)}${m.forecast ? ' · ' + esc(m.forecast) : ''}</div>`;
    if (p) {
      html += `<div class="pace ${p.overPace ? 'hot' : 'ok'}">Avg ${f1(p.avg)}%/${u} vs target ${f1(p.target)}%/${u} · ${p.delta >= 0 ? '+' : ''}${f1(p.delta)} pts</div>`;
      if (p.today !== null) {
        html += `<div class="pace ${p.todayOver ? 'hot' : 'ok'}">Today +${f1(p.today)}% · allowed ${f1(p.allowance)}% <span class="sub">(100/7 = ${f1(p.target)}%)</span>`
          + (p.todaySince ? ` <span class="sub">since ${new Date(p.todaySince * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>` : '') + '</div>';
      }
      if (p.budget !== null) {
        const rate = u === 'day' && p.leftUnits >= 1 ? ` (~${f1(p.budget)}%/day)` : '';
        html += `<div class="pace sub">Left ${f1(p.leftPct)}% for ${esc(p.leftText)}${rate}</div>`;
      }
    }
    return html + '</div>';
  }

  function contextBlock(c) {
    if (!c || !c.enabled) return '';
    if (!c.available) return `<div class="m"><div class="row"><span class="name">Claude Code context</span><span class="pct sub">—</span></div><div class="sub">${esc(c.reason || 'unavailable')}</div></div>`;
    const hot = c.pct >= 80;
    let html = `<div class="m"><div class="row"><span class="name">Claude Code context`
      + `<span class="badge ${c.active ? 'ok' : ''}" style="${c.active ? '' : 'color:var(--mut)'}">${c.active ? 'live' : 'idle'}</span></span>`
      + `<span class="pct ${hot ? 'hot' : ''}">${Math.round(c.pct)}%</span></div>`;
    html += bar(c.pct, hot, null);
    html += `<div class="sub">${kTok(c.tokens)} / ${kTok(c.limit)} tokens${c.model ? ' · ' + esc(c.model) : ''}</div>`;
    return html + '</div>';
  }

  window.meter.onData((d) => {
    let html = contextBlock(d.context);
    if (d.needsLogin) html += '<div class="empty">Not signed in — right-click the tray icon → Sign in.</div>';
    else if (!d.meters.length) html += `<div class="empty">${esc(d.error || 'Waiting for first reading…')}</div>`;
    else html += d.meters.map(meterBlock).join('');
    $('#list').innerHTML = html;
    const pin = $('#p');
    pin.classList.toggle('on', !!d.pinned);
    pin.title = d.pinned ? 'Pinned: always on top, drag the title to move. Click to unpin' : 'Keep on screen (always on top)';
    pin.style.filter = d.pinned ? 'none' : 'grayscale(1) opacity(.55)';
    $('#upd').textContent = d.updated ? 'Updated ' + new Date(d.updated).toLocaleTimeString() : '';
  });
  $('#r').onclick = () => window.meter.refresh();
  $('#p').onclick = () => window.meter.pin();
  $('#c').onclick = () => window.meter.openClaude();
  $('#x').onclick = () => window.meter.hide();
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.meter.hide(); });
</script>
</body>
</html>
